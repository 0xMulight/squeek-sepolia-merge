<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Squeek Merge · Sepolia</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 20px; background: #121216; color: #f2f2f5; max-width: 560px; margin-inline: auto; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p, li { color: #b8b8c2; font-size: 0.95rem; line-height: 1.45; }
    .card { background: #1c1c24; border: 1px solid #2e2e3a; border-radius: 14px; padding: 16px; margin: 14px 0; }
    label { display:block; font-size:.85rem; color:#9a9aa8; margin:10px 0 4px; }
    input { width:100%; box-sizing:border-box; border-radius:10px; border:1px solid #3a3a48; background:#101016; color:#fff; padding:12px; font-size:1rem; }
    button { width: 100%; border: 0; border-radius: 12px; padding: 14px 16px; font-size: 1rem; font-weight: 650; cursor: pointer; margin-top: 10px; }
    .primary { background: #6d5cff; color: white; }
    .primary:disabled { opacity: .45; cursor: not-allowed; }
    .quiet { background: #2a2a35; color: #eee; }
    .ok { color: #7dffb3; }
    .err { color: #ff8f8f; }
    code { font-size: .85rem; word-break: break-all; }
    .mono { font-family: ui-monospace, monospace; font-size: .85rem; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  </style>
</head>
<body>
  <h1>Squeek 一键合成（Sepolia）</h1>
  <p>公开工具页。调用 <code>SqueekNFT.merge(survivor, donor)</code>。donor 永久烧掉，任何人用自己的钱包签。</p>

  <div class="card">
    <div class="mono" id="status">未连接</div>
    <button class="quiet" id="connectBtn" type="button">连接钱包（OKX / MetaMask）</button>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label>留下的 survivor ID</label>
        <input id="survivor" type="number" min="1" value="5427" />
      </div>
      <div>
        <label>烧掉的 donor ID</label>
        <input id="donor" type="number" min="1" value="5428" />
      </div>
    </div>
    <button class="primary" id="mergeBtn" type="button" disabled>合成（merge）</button>
    <div class="mono" id="result"></div>
  </div>

  <div class="card">
    <p style="margin:0 0 8px"><b>快捷填你的两笔</b></p>
    <button class="quiet" id="pair1" type="button">填 5427 / 5428</button>
    <button class="quiet" id="pair2" type="button">填 5429 / 5430</button>
  </div>

  <p>合约 <code>0xC4C7982657f00509548F3a3a41db7FA439a6856B</code> · 网络 Sepolia · chainId 11155111</p>
  <p>源码：<a href="https://github.com/0xMulight/squeek-sepolia-merge" style="color:#9db7ff">github.com/0xMulight/squeek-sepolia-merge</a></p>

<script>
const NFT = "0xC4C7982657f00509548F3a3a41db7FA439a6856B";
const CHAIN = "0xaa36a7";

function eth() {
  return window.okxwallet?.ethereum || window.ethereum;
}

function encodeMerge(survivor, donor) {
  const sel = "d1c2babb";
  const a = BigInt(survivor).toString(16).padStart(64, "0");
  const b = BigInt(donor).toString(16).padStart(64, "0");
  return "0x" + sel + a + b;
}

async function ensureSepolia(provider) {
  const id = await provider.request({ method: "eth_chainId" });
  if (id.toLowerCase() === CHAIN) return;
  try {
    await provider.request({ method: "wallet_switchEthereumChain", params: [{ chainId: CHAIN }] });
  } catch (e) {
    if (e?.code === 4902) {
      await provider.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId: CHAIN,
          chainName: "Sepolia",
          nativeCurrency: { name: "SepoliaETH", symbol: "ETH", decimals: 18 },
          rpcUrls: ["https://ethereum-sepolia.publicnode.com"],
          blockExplorerUrls: ["https://sepolia.etherscan.io"],
        }],
      });
    } else throw e;
  }
}

async function connect() {
  const provider = eth();
  if (!provider) throw new Error("没检测到钱包插件。请用已安装 OKX / MetaMask 的浏览器打开。");
  await ensureSepolia(provider);
  const accounts = await provider.request({ method: "eth_requestAccounts" });
  document.getElementById("status").className = "mono ok";
  document.getElementById("status").textContent = "已连接 " + accounts[0];
  document.getElementById("mergeBtn").disabled = false;
  return accounts[0];
}

async function merge() {
  const provider = eth();
  const out = document.getElementById("result");
  const survivor = document.getElementById("survivor").value.trim();
  const donor = document.getElementById("donor").value.trim();
  out.className = "mono";
  if (!survivor || !donor || survivor === donor) {
    out.className = "mono err";
    out.textContent = "请填写两个不同的 token ID";
    return;
  }
  out.textContent = "请求签名中…";
  try {
    await ensureSepolia(provider);
    const accounts = await provider.request({ method: "eth_requestAccounts" });
    const from = accounts[0];
    const data = encodeMerge(survivor, donor);
    const txHash = await provider.request({
      method: "eth_sendTransaction",
      params: [{ from, to: NFT, value: "0x0", data }],
    });
    out.className = "mono ok";
    out.innerHTML = "已发送：<a href='https://sepolia.etherscan.io/tx/" + txHash + "' target='_blank' rel='noreferrer'>" + txHash + "</a>";
  } catch (e) {
    out.className = "mono err";
    out.textContent = e?.message || String(e);
  }
}

document.getElementById("connectBtn").onclick = () => connect().catch(e => {
  document.getElementById("status").className = "mono err";
  document.getElementById("status").textContent = e.message || String(e);
});
document.getElementById("mergeBtn").onclick = () => merge();
document.getElementById("pair1").onclick = () => { survivor.value = 5427; donor.value = 5428; };
document.getElementById("pair2").onclick = () => { survivor.value = 5429; donor.value = 5430; };
</script>
</body>
</html>
